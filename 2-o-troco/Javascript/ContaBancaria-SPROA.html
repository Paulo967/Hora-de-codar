<html>

<head>

	<script>

	    // Aqui criamos uma variavel global. Global significa que o elemento pode ser acessado por qualquer método. Para tornar global, utilizamos a palavra static.
    
		var saldo = 100.5; // Float (Número com ponto flutuante)

		var nomeUsuario = prompt("digite seu nome");

		alert("Olá " + nomeUsuario + " é um prazer ter você por aqui");

		/*  Função principal. */
		function inicio() {
			
			var escolha = parseInt(prompt('Selecione uma opção: 1.) Saldo 2.) Extrato 3.) Saque 4.) Depósito 5.) Transferência 6.) Sair'));
		
			

			switch (escolha) {case 1:
				ver_saldo ()
				 break;
				
				case 2: 
				ver_extrato ();
				 break;
				
				case 3: 
				fazer_saque();
				 break;
				 
				case 4:
				fazer_deposito();
				 break;
				
				case 5:
				fazer_transferencia();
				 break;
				 
				case 6:
				sair()
				 break;

				default: 
				erro();
				  break;  

			}
			
		}
			
		function ver_extrato() {
			var senha = parseInt(prompt("insira sua senha"));
			if (senha != 3589) {
				alert("senha incorreta, insira novamente.");
				ver_extrato()
			} else {
			alert("gol airlines 1500$");
			alert("lojas mel 100$");
			inicio();
		    }
		}

		/*  Função principal. */
		function ver_saldo() {
			var senha = parseInt(prompt("insira sua senha"));
			if (senha != 3589){
				alert("senha incorreta");
				ver_saldo()
			} else {
			alert('Seu saldo atual é: ' + saldo);
			inicio();
		    }
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_deposito() {
			var deposito = parseFloat(prompt('Qual o valor para depósito?')); 
			// Not a Number
			if (isNaN(deposito) || deposito === '') { // A Função isNaN checa se o valor informado é um Não-Número e retorna verdadeiro ou falso.
				alert('Por favor, informe um número:');
				fazer_deposito();
			} 
			else if (deposito <=0){
				alert("Por favor, informe um valor valido");
				fazer_deposito();
			}
			else {
				saldo += deposito;
				ver_saldo();
			}
		}

		function fazer_transferencia() {
			var senha = parseFloat(prompt("digite sua senha"));
			if (senha != 3589) {
			alert ("senha incorreta")
			fazer_transferencia();
		    }
			
			else {
			var conta = parseInt(prompt("digite a conta")); 
			if (isNaN(conta) || conta === ""){
			  alert("digite numeros validos");
			  fazer_transferencia();
			
		    } else {
				var valor= parseFloat(prompt("Insira o valor da transferencia"))
				if (valor<=0){
					alert("operação não autorizada")
					fazer_transferencia();
				
				}else if (valor > saldo){
					alert("operação não autorizada")
					fazer_transferencia()
				}else { (saldo -= valor)
					ver_saldo()
				}
			}	
		  }
	    }

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_saque() {
			var senha = parseInt(prompt("digite sua senha ")) 
				if (senha != 3589 ) {
					alert("senha incorreta")
					fazer_saque()
				} else {
					var saque = parseFloat(prompt('Qual o valor para saque?'));
					if (isNaN(saque) || saque === '') {
						alert('Por favor, informe um número:');
						fazer_saque();
					}
					
					else if (saque <=0){
						alert("O valor precisa ser maior que zero")
						fazer_saque()
					}

					else if ( saque>saldo){
						alert("operação não autorizada")
						fazer_saque()
					}	
					else {
						saldo -= saque;
						ver_saldo();
				}
			}
		}

		/* Verificar se há um erro */
		function erro() {
			alert('Por favor, informe um número entre 1 e 6');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
			alert (nomeUsuario + ", foi um prazer ter você aqui!")
				window.close();
			} else {

				inicio();
			}
		}


		
		inicio();
	</script>
</head>
