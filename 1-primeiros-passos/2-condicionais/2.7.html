<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero1 = Number(prompt("Digite o primeiro número"));
        let numero2 = Number(prompt("Digite o segundo número"));
        let numero3 = Number(prompt("Digite o terceiro número"));
        let numero4 = Number(prompt("Digite o quarto número"));
        let numero5 = Number(prompt("Digite o quinto número"));
        let numero6 = Number(prompt("Digite o sexto número"));

        let soma = 0;

        if (numero1 < 72) {
            soma += numero1;
        } if  (numero2 < 72) {
            soma += numero2;
        } if  (numero3 < 72) {
            soma += numero3;
        } if  (numero4 < 72) {
            soma += numero4;
        } if  (numero5 < 72) {
            soma += numero5;
        } if  (numero6 < 72) {
            soma += numero6;
        }

        console.log("Soma dos números menores que 72:", soma);

        console.log(
        "Números informados:",
        numero1,
        numero2,
        numero3,
        numero4,
        numero5,
        numero6
        );

    </script>
</body>
