<body>
    <script>
        let numero1 = Number(prompt("escreva o Primeiro numero"))
        let numero2 = Number(prompt("escreva o Segundo numero"))
        let numero3 = Number(prompt("escreva o Terceiro numero"))
        let numero4 = Number(prompt("escreva o Quarto numero"))

        while (numero1 <= 0 || numero1 >= 10) {
        numero1 = Number(prompt("Número inválido. Digite novamente"));
        }
        while (numero2 <= 0 || numero2 >= 10) {
        numero2 = Number(prompt("Número inválido. Digite novamente"));
        }
        while (numero3 <= 0 || numero3 >= 10) {
        numero3 = Number(prompt("Número inválido. Digite novamente"));
        }
        while (numero4 <= 0 || numero4 >= 10) {
        numero4 = Number(prompt("Número inválido. Digite novamente"));
        }

        let media = ( numero1+numero2+numero3+numero4)/4; {
            console.log("Média: " + media);
        }

        if (media > 5){
            console.log("Voce passou no teste")
        }

        else {
            console.log("Tente novamente")
        }

    </script>
