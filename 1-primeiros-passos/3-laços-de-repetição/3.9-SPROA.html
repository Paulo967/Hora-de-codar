<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let intervalo = 0
        let fora_intervalo = 0

        for (let contador = 1; contador <= 10; contador++) {
            let numero = Number(prompt("adicione um numero"))

            if (numero >= 24 && numero <= 42){
                intervalo++;
                //aumenta o contador dentro do intervalo 

            } else {
                intervalo++;
                //aumenta o contador fora fo intervalo

                console.log("Números dentro do intervalo: " + intervalo);
                console.log("Números fora do intervalo: " + fora_intervalo);

            }


        }
    </script>
</body>
</html>
